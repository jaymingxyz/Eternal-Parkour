name: "Nederlands"

main:
  name: "Eternal Parkour"

play:
  name: "Spelen"

  item:
    material: "sugar_cane"
    name: "<#60EB76><bold>Spelen"
    lore: "<#FFD166>» Klik om te openen"

  single:
    name: "Alleen"

    item:
      material: "ender_pearl"
      name: "<#6E92B1><bold>Alleen spelen"
      lore: "<#FFD166>» Klik om te kiezen"

    default:
      material: "barrel"
      name: "<#6693E7><bold>Normaal"
      lore: "<gray>De normale mode."

  spectator:
    name: "Toekijker"

    join: "<#4CB3FF>Je bent nu een toekijker. Gebruik \"/parkour\" om te leaven of iets anders te doen."
    action_bar: "<#4CB3FF>Je bent een toekijker <gray>• <#4CB3FF>Gebruik \"/parkour\" om te leaven."

    other_join: "<dark_green><bold>+ <reset><gray>%s is je nu aan het toekijken."
    other_leave: "<red><bold>- <reset><gray>%s is gestopt met je toe te kijken."

    item:
      material: "glass"
      name: "<#39D5AB><bold>Toekijker"
      lore: "<#FFD166>» Klik om te kiezen"

    head:
      material: ""
      name: "<#6693E7><bold>%s"
      lore: ""

community:
  name: "Gemeenschap"

  item:
    material: "oak_boat"
    name: "<#60C9DF><bold>Gemeenschap"
    lore: "<#FFD166>» Klik om te openen"

  leaderboards:
    name: "Klassementen"

    item:
      material: "gold_nugget"
      name: "<#6693E7><bold>Klassementen"
      lore: "<#FFD166>» Klik om te openen"

    sort:
      material: "bookshelf"
      name: "<#DEA11F><bold>Gesorteerd op %s"
      lore: ""
      values: ["score", "tijd", "moeilijkheid"]

    head:
      material: ""
      name: "<#6693E7><bold>#%r - %p"
      lore: "<#5574AF>Score: <gray>%s||<#5574AF>Tijd: <gray>%t||<#5574AF>Moeilijkheid: <gray>%d<gray>/1.0"
    title: "Klassement · %s"

settings:
  name: "Instellingen"

  item:
    material: "comparator"
    name: "<#6086EB><bold>Instellingen"
    lore: "<#FFD166>» Klik om te openen"

  lang:
    name: "Taal"

    item:
      material: "writable_book"
      name: "<#6693E7><bold>Taal"
      lore: "<gray>Huidige waarde: <#5574AF><bold>%s||||<#FFD166>» Klik om te wijzigen"

  chat:
    material: "crossbow"
    name: "<#20C6BC><bold>Chat"
    lore: "<gray>Huidige waarde: <#17B2CE><bold>%s||<gray>Selecteer met wie je kan praten||||<#FFD166>» Klik om te wijzigen"
    values: ["alleen met lobby", "alleen met spelers", "publiek"]

    formats:
      lobby: "<#8A1010>(Lobby) <#BE0D0D>%s <dark_gray>> <gray>%s"
      players: "<#8A1010>(Spelers) <#BE0D0D>%s <dark_gray>> <gray>%s"

  parkour_settings:

    enabled: "<#0DCB07><bold>✔"
    disabled: "<red><bold>✘"

    item:
      material: "redstone"
      name: "<#A10404><bold>Parkourinstellingen"
      lore: "<gray>Verander de manier waarop het parkour verschijnt.||||<#FFD166>» Klik om te openen"

    items:

      no_change:
        material: "barrier"
        name: "<dark_red><bold>Je mag dit nu niet doen!"
        lore: "<gray>Je hebt een score die hoger is dan 0,||<gray>wat betekent dat je dit niet mag veranderen."

      styles:
        name: "Stijlen"

        style_item:
          material: ""
          name: "<white><bold>%s"
          lore: "<#5574AF>Categorie: <gray>%s"

        item:
          material: "crafting_table"
          name: "<#6693E7><bold>Stijl"
          lore: "<#5574AF>Huidige waarde: <gray>%s||<gray>Selecteer welke blokken worden gebruikt.||||<#FFD166>» Klik om te kiezen"

      leads:
        material: "feather"
        name: "<#6693E7><bold>Voorsprong"
        lore: "<#5574AF>Huidige waarde: <gray>%s blocks||<gray>Hoeveel blokken er voor je||<gray>zullen verschijnen.||||<#FFD166>» Klik om te wijzigen"

      time:
        material: "clock"
        name: "<#6693E7><bold>Tijd"
        lore: "<#5574AF>Huidige waarde: <gray>%s||<gray>Je huidige visuele tijd.||||<#FFD166>» Klik om te wijzigen"

      schematics:
        material: ""
        name: "<#6693E7><bold>Schematicmoeilijkheid"
        lore: "<#5574AF>Huidige waarde: <gray>%s||<gray>De moeilijkheid van de schematics||||<#FFD166>» Klik om te wijzigen"
        values: ["<red>uit", "<#0DCB07>makkelijk", "<yellow>medium", "<#FF6C17>moeilijk", "<dark_red>erg moeilijk"]

      scoreboard:
        material: ""
        name: "Scoreboard laten zien"
        lore: "<gray>Huidige waarde: %s||<gray>Als dit aan staat kan je het scoreboard zien.||||<#FFD166>» Klik om aan of uit te zetten"

      fall_message:
        item:
          material: ""
          name: "Valbericht laten zien"
          lore: "<gray>Huidige waarde: %s||<gray>Als dit aan staat krijg je een bericht||<gray>met extra info.||||<#FFD166>» Klik om aan of uit te zetten"

        divider: "<dark_gray><strikethrough>-----------------------------------"
        score: "<#80C7FD><bold>Score <reset><white>%s"
        time: "<#80C7FD><bold>Tijd <reset><white>%s"
        high_score: "<#80C7FD><bold>High-score <reset><white>%s"

        formats:
          miss: "<gray>Je hebt je high-score gemist met %s punten!"
          beat: "<gray>Je hebt je high-score verslagen met %s punten!"
          tied: "<gray>Je hebt dezelfde score gekregen als je high-score!"

      particles:
        material: ""
        name: "Particles laten zien"
        lore: "<gray>Huidige waarde: %s||<gray>Als dit aan staat zal elk blok||<gray>particles laten zien.||||<#FFD166>» Klik om aan of uit te zetten"

      sound:
        material: ""
        name: "Geluid"
        lore: "<gray>Huidige waarde: %s||<gray>Als dit aan staat zal elk blok||<gray>een geluid afspelen.||||<#FFD166>» Klik om aan of uit te zetten"

      special_blocks:
        material: ""
        name: "Speciale blokken gebruiken"
        lore: "<gray>Huidige waarde: %s||<gray>Als dit aan staat komen speciale blokken||<gray>zoals ice and slabs in het parkour voor.||||<#FFD166>» Klik om aan of uit te zetten"

      score_difficulty:
        material: ""
        name: "Scoremoeilijkheid"
        lore: "<gray>Huidige waarde: %s||<gray>Als dit aan staat zorgt een hogere score||<gray>voor moeilijkere jumps.||||<#FFD166>» Klik om aan of uit te zetten"
    name: "Parkourinstellingen"

lobby:
  name: "Lobby"

  other_join: '<dark_green><bold>+ <gray>%s is je lobby gejoined'
  other_leave: '<red><bold>_ <gray>%s heeft je lobby verlaten'

  item:
    material: "iron_ingot"
    name: "<#EB608C><bold>Jouw Lobby"
    lore: "<#FFD166>» Klik om te openen"

  visibility:
    material: "firework_rocket"
    name: "<#A1E1DD><bold>Zichtbaarheid"
    lore: "<gray>Huidige waarde: <#2BD4E2><bold>%s||<gray>Selecteer wie jouw lobby kan joinen.||||<#FFD166>» Klik om te wijzigen"
    values: ["privé", "alleen met invites", "publiek"]

  player_management:
    name: "Spelers beheren"

    kicked: "<gray>Je bent uit je vorige lobby gegooid door de eigenaar van de lobby."
    advice: "<gray>Zet je lobbyzichtbaarheid naar alleen met invite of privé om te voorkomen dat willekeurige mensen joinen."
    muted: "<gray>Je bent door de eigenaar van de lobby gemute."
    unmuted: "<gray>Je bent door de eigenaar van de lobby ge-unmute."

    item:
      material: "cake"
      name: "<#8DC9E5><bold>Spelers beheren"
      lore: "<gray>Hier kan je spelers kicken of muten.||||<#FFD166>» Klik om te openen"

    head:
      material: ""
      name: "<#4BD16D><bold>%s"
      lore: ""
      top: "<gray>Gemute in deze lobby||"
      bottom: "<#8DE5A3>Klik met links<gray> om deze speler de lobby uit te gooien.||<#8DE5A3>Klik met rechts<gray> om deze speler te (un)muten."

scoreboard:

  title: "<#FF6464><bold>Eternal Parkour"

  lines:
    - "<blue>"
    - "<#F6A8A8>Score <white>%score%"
    - "<#F6A8A8>Tijd <white>%time%"
    - "<#F6A8A8>High-score <white>%high_score%"
    - "<red>"
    - "<#FF6464><bold>server.ip"

other:

  no_do: "<gray>Dit kan je nu niet doen."
  no_teleporting: "<white>Je mag niet naar de de parkourwereld teleporten."
  customize: "<gray>Verander je parkourervaring met \"/parkour\""

  quit:
    material: "barrier"
    name: "<#D71F1F><bold>Stoppen"
    lore: "<#FFD166>» Klik om te stoppen"

  close:
    material: "oak_door"
    name: "<#F5A3A3><bold>Sluiten"
    lore: "<gray>Sluit dit menu."

  iep:
    material: "elytra"
    name: "<#4800FF><bold>Vliegen"
    lore: "<gray>Parkour met elytra!||||<#FFD166>» Klik om te kiezen"
  back:
    material: "arrow"
    name: "<#F5A3A3><bold>Terug"
    lore: "<gray>Ga terug naar het vorige menu."
  previous_page:
    material: "spectral_arrow"
    name: "<#FFD166><bold>« Vorige pagina"
    lore: "<gray>Pagina %page% van %pages%"
  next_page:
    material: "spectral_arrow"
    name: "<#FFD166><bold>Volgende pagina »"
    lore: "<gray>Pagina %page% van %pages%"
  empty:
    material: "cobweb"
    name: "<gray>Hier is nog niets"
    lore: ""
  hints:
    open: "<#FFD166>» Klik om te openen"
    play: "<#FFD166>» Klik om te spelen"
    view: "<#FFD166>» Klik om te bekijken"
    spectate: "<#FFD166>» Klik om toe te kijken"
    select: "<#FFD166>» Klik om te kiezen"
    selected: "<#0DCB07>✔ Gekozen"
    change: "<#FFD166>» Klik om te wijzigen"
    toggle: "<#FFD166>» Klik om aan of uit te zetten"
    create: "<#FFD166>» Klik om een lobby te maken"
    join: "<#FFD166>» Klik om mee te doen"
    invite: "<#FFD166>» Klik om uit te nodigen"
    choose: "<#FFD166>» Klik om te kiezen"
    leave: "<#FFD166>» Klik om te stoppen"
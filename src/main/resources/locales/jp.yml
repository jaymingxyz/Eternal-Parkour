settings:
  name: "設定"

  item:
    material: "comparator"
    name: "<#6086EB><bold>設定"
    lore: "<#FFD166>» クリックで開く"

  lang:
    name: "言葉"

    item:
      material: "writable_book"
      name: "<#6693E7><bold>言葉"
      lore: "<gray>今: <#5574AF><bold>%s||||<#FFD166>» クリックで変更"

  chat:
    material: "crossbow"
    name: "<#20C6BC><bold>チャット"
    lore: "<gray>今: <#17B2CE><bold>%s||<gray>Select who you can chat with||||<#FFD166>» クリックで変更"
    values: ["ロビーのみ", "プレイヤーのみ", "公共"]

    formats:
      lobby: "<#8A1010>(ロビー) <#BE0D0D>%s <dark_gray>> <gray>%s"
      players: "<#8A1010>(プレイヤー) <#BE0D0D>%s <dark_gray>> <gray>%s"

  parkour_settings:

    enabled: "<#0DCB07><bold>✔"
    disabled: "<red><bold>✘"

    item:
      material: "redstone"
      name: "<#A10404><bold>パルクールの設定"
      lore: "<gray>Change the way your parkour appears.||||<#FFD166>» クリックで開く"

    items:

      no_change:
        material: "barrier"
        name: "<dark_red><bold>これを変えられません。"
        lore: "<gray>You have a score above 0,||<gray>which means you cant change this setting."

      styles:
        name: "スタイル"

        style_item:
          material: ""
          name: "<white><bold>%s"
          lore: "<#5574AF>種類: <gray>%s"

        item:
          material: "crafting_table"
          name: "<#6693E7><bold>スタイル"
          lore: "<#5574AF>今: <gray>%s||<gray>ブロックのスタイル。||||<#FFD166>» クリックで選択"

      leads:
        material: "feather"
        name: "<#6693E7><bold>先のブロックの数"
        lore: "<#5574AF>今: <gray>%sブロック||<gray>先のブロックの数。||||<#FFD166>» クリックで変更"

      time:
        material: "clock"
        name: "<#6693E7><bold>時間"
        lore: "<#5574AF>今: <gray>%s||<gray>今の時間。||||<#FFD166>» クリックで変更"

      schematics:
        material: ""
        name: "<#6693E7><bold>スキマティクの難しさ"
        lore: "<#5574AF>今: <gray>%s||<gray>スキマティクの難しさ。||||<#FFD166>» クリックで変更"
        values: ["<red>オフ", "<#0DCB07>初級", "<yellow>中級", "<#FF6C17>高級", "<dark_red>上級"]

      scoreboard:
        material: ""
        name: "スコアボードを見せる"
        lore: "<gray>今: %s||<gray>オン時、スコアボードを見せる。||||<#FFD166>» クリックで切り替え"

      fall_message:
        item:
          material: ""
          name: "転ぶのメッセージを見せる"
          lore: "<gray>今: %s||<gray>If enabled shows a message when you fall||<gray>with extra info.||||<#FFD166>» クリックで切り替え"

        divider: "<dark_gray><strikethrough>-----------------------------------"
        score: "<#80C7FD><bold>得点 <reset><white>%s"
        time: "<#80C7FD><bold>時間 <reset><white>%s"
        high_score: "<#80C7FD><bold>高得点 <reset><white>%s"

        formats:
          miss: "<gray>You missed your high score by %s points!"
          beat: "<gray>You beat your high score by %s points!"
          tied: "<gray>You tied your high score!"

      particles:
        material: ""
        name: "パチケるを見せる"
        lore: "<gray>今: %s||<gray>オン時、every generated block||<gray>will show particles.||||<#FFD166>» クリックで切り替え"

      sound:
        material: ""
        name: "音をプレイします"
        lore: "<gray>今: %s||<gray>オン時、every generated block||<gray>will play a sound.||||<#FFD166>» クリックで切り替え"

      special_blocks:
        material: ""
        name: "特別のブロックの使用"
        lore: "<gray>今: %s||<gray>オン時、uses special blocks like ice and slabs.||||<#FFD166>» クリックで切り替え"

      score_difficulty:
        material: ""
        name: "得点の難しさ"
        lore: "<gray>今: %s||<gray>オン時、 the higher score you have,||<gray>the more difficult it gets.||||<#FFD166>» クリックで切り替え"
    name: "パルクール設定"

lobby:

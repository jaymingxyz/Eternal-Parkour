name: "Français"

main:
  name: "Eternal Parkour"

play:
  name: "Jouer"
  
  item:
    material: "sugar_cane"
    name: "<#60EB76><bold>Jouer"
    lore: "<#FFD166>» Cliquez pour ouvrir"
  
  single:
    name: "Seul"
    
    item:
      material: "ender_pearl"
      name: "<#6E92B1><bold>Seul"
      lore: "<#FFD166>» Cliquez pour choisir"
    
    default:
      material: "barrel"
      name: "<#6693E7><bold>Defaut"
      lore: "<gray>Le type de jeu par défaut."
  
  spectator:
    name: "Spectateur"
    
    join: "<#4CB3FF>Vous êtes maintenant un spectateur. Tu peux utiliser \"/parkour\" pour quitter/changer ton mode de jeu."
    action_bar: "<#4CB3FF>Vous êtes un spectateur <gray>- <#4CB3FF>Utilisez \"/parkour\" pour partir."
    
    other_join: "<dark_green><bold>+ <reset><gray>%s a commencer a vous regarder"
    other_leave: "<red><bold>- <reset><gray>%s a arretter de vous regarder"
    
    item:
      material: "glass"
      name: "<#39D5AB><bold>Spectateur"
      lore: "<#FFD166>» Cliquez pour choisir"
    
    head:
      material: ""
      name: "<#6693E7><bold>%s"
      lore: ""

community:
  name: "Communauté"
  
  item:
    material: "oak_boat"
    name: "<#60C9DF><bold>Communauté"
    lore: "<#FFD166>» Cliquez pour ouvrir"
  
  leaderboards:
    name: "Tableau des Scores"
    
    item:
      material: "gold_nugget"
      name: "<#6693E7><bold>Tableau des Scores"
      lore: "<#FFD166>» Cliquez pour ouvrir"
    
    sort:
      material: "bookshelf"
      name: "<#DEA11F><bold>Sorté par %s"
      lore: ""
      values: [ "score", "temps", "difficulté" ]
    
    head:
      material: ""
      name: "<#6693E7><bold>#%r - %p"
      lore: "<#5574AF>Score: <gray>%s||<#5574AF>Temps: <gray>%t||<#5574AF>Difficulté: <gray>%d<gray>/1.0"
    title: "Classement · %s"

settings:
  name: "Paramètre"
  
  item:
    material: "comparator"
    name: "<#6086EB><bold>Paramètre"
    lore: "<#FFD166>» Cliquez pour ouvrir"
  
  lang:
    name: "Langue"
    
    item:
      material: "writable_book"
      name: "<#6693E7><bold>Langue"
      lore: "<gray>Pour le moment: <#5574AF><bold>%s||||<#FFD166>» Cliquez pour modifier"
  
  chat:
    material: "crossbow"
    name: "<#20C6BC><bold>Chat"
    lore: "<gray>Pour le moment: <#17B2CE><bold>%s||<gray>Sélectionnez avec qui vous pouvez parler||||<#FFD166>» Cliquez pour modifier"
    values: [ "seulement lobby", "seulement joueurs", "publique" ]
    
    formats:
      lobby: "<#8A1010>(Lobby) <#BE0D0D>%s <dark_gray>> <gray>%s"
      players: "<#8A1010>(Joueurs) <#BE0D0D>%s <dark_gray>> <gray>%s"
  
  parkour_settings:

    enabled: "<#0DCB07><bold>✔"
    disabled: "<red><bold>✘"

    item:
      material: "redstone"
      name: "<#A10404><bold>Paramètres du Parkour"
      lore: "<gray>Changez l'apparence de votre parkour.||||<#FFD166>» Cliquez pour ouvrir"
    
    items:
      
      no_change:
        material: "barrier"
        name: "<dark_red><bold>Vous ne pouvez pas changer ça maintenant!"
        lore: "<gray>Vous avez un score supérieur à 0,||<gray> ce qui signifie que vous ne pouvez pas changer ce réglage."
      
      styles:
        name: "Styles"

        style_item:
          material: ""
          name: "<white><bold>%s"
          lore: "<#5574AF>Category: <gray>%s"

        item:
          material: "crafting_table"
          name: "<#6693E7><bold>Style"
          lore: "<#5574AF>Pour le moment: <gray>%s||<gray>Choisissez les blocs qui seront utilisés.||||<#FFD166>» Cliquez pour choisir"
      
      leads:
        material: "feather"
        name: "<#6693E7><bold>Chef"
        lore: "<#5574AF>Pour le moment: <gray>%s blocks||<gray>Combien de blocks||<gray>seront générés devant vous.||||<#FFD166>» Cliquez pour modifier"
      
      time:
        material: "clock"
        name: "<#6693E7><bold>Temps"
        lore: "<#5574AF>Pour le moment: <gray>%s||<gray>Votre temps visuel actuel.||||<#FFD166>» Cliquez pour modifier"

      schematics:
        material: ""
        name: "<#6693E7><bold>Difficulté des schématique"
        lore: "<#5574AF>Pour le moment: <gray>%s||<gray>La difficulté des schématique||||<#FFD166>» Cliquez pour modifier"
        values: ["<red>désactivé", "<#0DCB07>simple", "<yellow>moyen", "<#FF6C17>dur", "<dark_red>très dur"]
      
      scoreboard:
        material: ""
        name: "Montrer le scoreboard"
        lore: "<gray>Pour le moment: %s||<gray>S''il est activé, il affiche le scoreboard.||||<#FFD166>» Cliquez pour activer ou désactiver"
      
      fall_message:
        item:
          material: ""
          name: "Afficher le message de chute"
          lore: "<gray>Pour le moment: %s||<gray>Si il est activée, elle affiche un message lorsque vous tombez||<gray>avec des infos en plus.||||<#FFD166>» Cliquez pour activer ou désactiver"
        
        divider: "<dark_gray><strikethrough>-----------------------------------"
        score: "<#80C7FD><bold>Score <reset><white>%s"
        time: "<#80C7FD><bold>Temps <reset><white>%s"
        high_score: "<#80C7FD><bold>Meilleur Score <reset><white>%s"
        
        formats:
          miss: "<gray>Vous avez raté votre meilleur score de %s points!"
          beat: "<gray>Vous avez battu votre meilleur score de %s points!"
          tied: "<gray>Vous avez égalé votre meilleur score!"
      
      particles:
        material: ""
        name: "Montrer les particules"
        lore: "<gray>Pour le moment: %s||<gray>S''il est activé, chaque bloc généré||<gray>montrera des particules.||||<#FFD166>» Cliquez pour activer ou désactiver"
      
      sound:
        material: ""
        name: "Jouer des sons"
        lore: "<gray>Pour le moment: %s||<gray>S''il est activé, chaque bloc généré||<gray>jouera un sond.||||<#FFD166>» Cliquez pour activer ou désactiver"
      
      special_blocks:
        material: ""
        name: "Utiliser des blocs spéciaux"
        lore: "<gray>Pour le moment: %s||<gray>Si activé, utilise des blocs spéciaux comme la glace et les dalles.||||<#FFD166>» Cliquez pour activer ou désactiver"
      
      score_difficulty:
        material: ""
        name: "Difficulté du score"
        lore: "<gray>En ce moment: %s||<gray>Lorsqu''il est activé, plus votre score est élevé,||<gray>plus cela devient difficile.||||<#FFD166>» Cliquez pour activer ou désactiver"
    name: "Paramètres du parkour"

lobby:
  name: "Lobby"

  other_join: '<dark_green><bold>+ <reset><gray>%s a rejoins le Lobby'
  other_leave: '<red><bold>- <reset><gray>%s à quitté le lobby'

  item:
    material: "iron_ingot"
    name: "<#EB608C><bold>Votre Lobby"
    lore: "<#FFD166>» Cliquez pour ouvrir"
  
  visibility:
    material: "firework_rocket"
    name: "<#A1E1DD><bold>Visibility"
    lore: "<gray>Pour le moment: <#2BD4E2><bold>%s||<gray>Sélectionnez qui peut rejoindre votre lobby.||||<#FFD166>» Cliquez pour modifier"
    values: [ "privée", "sur invitation", "publique" ]
  
  player_management:
    name: "Gérer les joueurs"
    
    kicked: "<gray>Vous avez été kick de votre lobby par l'owner."
    advice: "<gray>Définissez la visibilité de votre lobby comme étant sur invitation seulement ou privée afin d'éviter que des personnes ne rejoigne."
    muted: "<gray>Vous avez été mute par l'owner du Lobby."
    unmuted: "<gray>Vous avez été unmute par l'owner du Lobby."
    
    item:
      material: "cake"
      name: "<#8DC9E5><bold>Gérer les joueurs"
      lore: "<gray>Kick ou mute les players ici.||||<#FFD166>» Cliquez pour ouvrir"
    
    head:
      material: ""
      name: "<#4BD16D><bold>%s"
      lore: ""
      top: "<gray>Muté dans le lobby||"
      bottom: "<#8DE5A3>Clique gauche<gray> pour kick du lobby||<#8DE5A3>Clique droit<gray> pour (un)mute dans le lobby"

scoreboard:
  
  title: "<#FF6464><bold>Eternal Parkour"
  
  lines:
  - "<blue>"
  - "<#F6A8A8>Score <white>%score%"
  - "<#F6A8A8>Temps <white>%time%"
  - "<#F6A8A8>Highscore <white>%high_score%"
  - "<red>"
  - "<#FF6464><bold>server.ip"

other:
  
  no_do: "<gray>Vous ne pouvez pas faire ça maintenant."
  no_teleporting: "<white>You can't enter the parkour world by teleporting!"
  customize: "<gray>Customisez votre parkour en faisant \"/parkour\""
  
  quit:
    material: "barrier"
    name: "<#D71F1F><bold>Quitter"
    lore: "<#FFD166>» Cliquez pour quitter"
  
  close:
    material: "oak_door"
    name: "<#F5A3A3><bold>Fermé"
    lore: "<gray>Fermer ce menu."

  iep:
    material: "elytra"
    name: "<#4800FF><bold>Flying"
    lore: "<gray>Parkour with elytra!||||<#FFD166>» Cliquez pour choisir"
  back:
    material: "arrow"
    name: "<#F5A3A3><bold>Retour"
    lore: "<gray>Revenir au menu précédent."
  previous_page:
    material: "spectral_arrow"
    name: "<#FFD166><bold>« Page précédente"
    lore: "<gray>Page %page% sur %pages%"
  next_page:
    material: "spectral_arrow"
    name: "<#FFD166><bold>Page suivante »"
    lore: "<gray>Page %page% sur %pages%"
  empty:
    material: "cobweb"
    name: "<gray>Rien pour le moment"
    lore: ""
  hints:
    open: "<#FFD166>» Cliquez pour ouvrir"
    play: "<#FFD166>» Cliquez pour jouer"
    view: "<#FFD166>» Cliquez pour voir"
    spectate: "<#FFD166>» Cliquez pour regarder"
    select: "<#FFD166>» Cliquez pour choisir"
    selected: "<#0DCB07>✔ Sélectionné"
    change: "<#FFD166>» Cliquez pour modifier"
    toggle: "<#FFD166>» Cliquez pour activer ou désactiver"
    create: "<#FFD166>» Cliquez pour créer un salon"
    join: "<#FFD166>» Cliquez pour rejoindre"
    invite: "<#FFD166>» Cliquez pour inviter"
    choose: "<#FFD166>» Cliquez pour choisir"
    leave: "<#FFD166>» Cliquez pour quitter"
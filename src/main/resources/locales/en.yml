# English (English, en)
# By Efnilite
# Copy this file and rename it to add your own language!
# Materials have to be from: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
# Learn more about colouring: https://docs.adventure.kyori.net/minimessage/format.html#format

name: "English"

main:
  name: "Eternal Parkour"

play:
  name: "Play"

  item:
    material: "sugar_cane"
    name: "<#60EB76><bold>Play"
    lore: "<gray>Pick a mode and start a run.||||<#FFD166>» Click to open"

  single:
    name: "Single-player"

    item:
      material: "ender_pearl"
      name: "<#6E92B1><bold>Single-player"
      lore: "<gray>Endless parkour on your own.||||<#FFD166>» Click to choose"

    default:
      material: "barrel"
      name: "<#6693E7><bold>Default"
      lore: "<gray>The classic endless parkour."

  spectator:
    name: "Spectate"

    join: "<#4CB3FF>You are now a spectator. You can use \"/parkour\" to leave/change your gamemode."
    action_bar: "<#4CB3FF>You are a spectator <gray>• <#4CB3FF>Use \"/parkour\" to leave."

    other_join: "<dark_green><bold>+ <reset><gray>%s started spectating you"
    other_leave: "<red><bold>- <reset><gray>%s stopped spectating you"

    item:
      material: "glass"
      name: "<#39D5AB><bold>Spectator"
      lore: "<gray>Watch another player's run.||||<#FFD166>» Click to choose"

    head:
      material: ""
      name: "<#6693E7><bold>%s"
      lore: ""

community:
  name: "Community"

  item:
    material: "oak_boat"
    name: "<#60C9DF><bold>Community"
    lore: "<gray>Leaderboards and open lobbies.||||<#FFD166>» Click to open"

  leaderboards:
    name: "Leaderboards"

    item:
      material: "gold_nugget"
      name: "<#6693E7><bold>Leaderboards"
      lore: "<gray>The best runs of every mode.||||<#FFD166>» Click to open"

    sort:
      material: "bookshelf"
      name: "<#DEA11F><bold>Sorted by %s"
      lore: ""
      values: ["score", "time", "difficulty"]

    head:
      material: ""
      name: "<#6693E7><bold>#%r - %p"
      lore: "<#5574AF>Score: <gray>%s||<#5574AF>Time: <gray>%t||<#5574AF>Difficulty: <gray>%d<dark_gray>/1.0"
    title: "Leaderboard · %s"

settings:
  name: "Settings"

  item:
    material: "comparator"
    name: "<#6086EB><bold>Settings"
    lore: "<gray>Your language, chat and parkour.||||<#FFD166>» Click to open"

  lang:
    name: "Language"

    item:
      material: "writable_book"
      name: "<#6693E7><bold>Language"
      lore: "<gray>Currently: <white>%s||||<#FFD166>» Click to change"

  chat:
    material: "crossbow"
    name: "<#20C6BC><bold>Chat"
    lore: "<gray>Currently: <white>%s||<gray>Who you can chat with.||||<#FFD166>» Click to change"
    values: ["lobby only", "players only", "public"]

    formats:
      lobby: "<#8A1010>(Lobby) <#BE0D0D>%s <dark_gray>> <gray>%s"
      players: "<#8A1010>(Players) <#BE0D0D>%s <dark_gray>> <gray>%s"

  parkour_settings:

    enabled: "<#0DCB07><bold>✔"
    disabled: "<red><bold>✘"

    item:
      material: "redstone"
      name: "<#A10404><bold>Parkour Settings"
      lore: "<gray>How your parkour looks and plays.||||<#FFD166>» Click to open"

    items:

      no_change:
        material: "barrier"
        name: "<dark_red><bold>You cant change this right now!"
        lore: "<gray>You have a score above 0,||<gray>which means you cant change this setting."

      styles:
        name: "Styles"

        style_item:
          material: ""
          name: "<white><bold>%s"
          lore: "<gray>Category: <white>%s"

        item:
          material: "crafting_table"
          name: "<#6693E7><bold>Style"
          lore: "<gray>Currently: <white>%s||<gray>The blocks your parkour is made of.||||<#FFD166>» Click to choose"

      leads:
        material: "feather"
        name: "<#6693E7><bold>Lead"
        lore: "<gray>Currently: <white>%s blocks||<gray>How many blocks are generated||<gray>ahead of you.||||<#FFD166>» Click to change"

      time:
        material: "clock"
        name: "<#6693E7><bold>Time"
        lore: "<gray>Currently: <white>%s||<gray>The time of day you see.||||<#FFD166>» Click to change"

      schematics:
        material: ""
        name: "<#6693E7><bold>Schematic difficulty"
        lore: "<gray>Currently: %s||<gray>How hard the structures are.||||<#FFD166>» Click to change"
        values: ["<red>off", "<#0DCB07>easy", "<yellow>medium", "<#FF6C17>hard", "<dark_red>very hard"]

      scoreboard:
        material: ""
        name: "Show scoreboard"
        lore: "<gray>Currently: %s||<gray>Your score and time on the side.||||<#FFD166>» Click to toggle"

      fall_message:
        item:
          material: ""
          name: "Show fall message"
          lore: "<gray>Currently: %s||<gray>Your score and time when you fall.||||<#FFD166>» Click to toggle"

        divider: "<dark_gray><strikethrough>-----------------------------------"
        score: "<#80C7FD><bold>Score <reset><white>%s"
        time: "<#80C7FD><bold>Time <reset><white>%s"
        high_score: "<#80C7FD><bold>High-score <reset><white>%s"

        formats:
          miss: "<gray>You missed your high score by %s points!"
          beat: "<gray>You beat your high score by %s points!"
          tied: "<gray>You tied your high score!"

      particles:
        material: ""
        name: "Show particles"
        lore: "<gray>Currently: %s||<gray>Particles around every new block.||||<#FFD166>» Click to toggle"

      sound:
        material: ""
        name: "Play sounds"
        lore: "<gray>Currently: %s||<gray>A sound for every new block.||||<#FFD166>» Click to toggle"

      special_blocks:
        material: ""
        name: "Use special blocks"
        lore: "<gray>Currently: %s||<gray>Ice, slabs, glass panes and fences.||||<#FFD166>» Click to toggle"

      score_difficulty:
        material: ""
        name: "Score difficulty"
        lore: "<gray>Currently: %s||<gray>The higher your score,||<gray>the harder it gets.||||<#FFD166>» Click to toggle"
    name: "Parkour settings"

lobby:
  name: "Your lobby"

  other_join: '<dark_green><bold>+ <reset><gray>%s joined your lobby'
  other_leave: '<red><bold>- <reset><gray>%s left your lobby'

  item:
    material: "iron_ingot"
    name: "<#EB608C><bold>Your Lobby"
    lore: "<gray>Invite players and choose||<gray>who can join.||||<#FFD166>» Click to open"

  visibility:
    material: "firework_rocket"
    name: "<#A1E1DD><bold>Visibility"
    lore: "<gray>Currently: <white>%s||<gray>Who can join your lobby.||||<#FFD166>» Click to change"
    values: ["private", "invite-only", "public"]

  player_management:
    name: "Manage players"

    kicked: "<gray>You've been kicked from your lobby by the lobby owner."
    advice: "<gray>Set your lobby visibility to invite-only or private to avoid people randomly joining."
    muted: "<gray>You've been muted by the lobby owner."
    unmuted: "<gray>You've been unmuted by the lobby owner."

    item:
      material: "cake"
      name: "<#8DC9E5><bold>Manage Players"
      lore: "<gray>Kick or mute players.||||<#FFD166>» Click to open"

    head:
      material: ""
      name: "<#4BD16D><bold>%s"
      lore: ""
      top: "<red>Muted||"
      bottom: "<#FFD166>Left-click <gray>to kick||<#FFD166>Right-click <gray>to mute or unmute"

scoreboard:

  title: "<#FF6464><bold>Eternal Parkour"

  lines:
    - "<blue>"
    - "<#F6A8A8>Score <white>%score%"
    - "<#F6A8A8>Time <white>%time%"
    - "<#F6A8A8>Highscore <white>%high_score%"
    - "<red>"
    - "<#FF6464><bold>server.ip"

other:

  no_do: "<gray>You can't do this right now."
  no_teleporting: "<white>You can't enter the parkour world by teleporting!"
  customize: "<gray>Customize your parkour experience by using \"/parkour\""

  quit:
    material: "barrier"
    name: "<#D71F1F><bold>Quit"
    lore: "<gray>Leave parkour and get||<gray>your things back.||||<#FFD166>» Click to leave"

  close:
    material: "oak_door"
    name: "<#F5A3A3><bold>Close"
    lore: "<gray>Close this menu."

  iep:
    material: "elytra"
    name: "<#4800FF><bold>Flying"
    lore: "<gray>Parkour with an elytra.||||<#FFD166>» Click to choose"
  back:
    material: "arrow"
    name: "<#F5A3A3><bold>Back"
    lore: "<gray>Return to the previous menu."
  previous_page:
    material: "spectral_arrow"
    name: "<#FFD166><bold>« Previous page"
    lore: "<gray>Page %page% of %pages%"
  next_page:
    material: "spectral_arrow"
    name: "<#FFD166><bold>Next page »"
    lore: "<gray>Page %page% of %pages%"
  empty:
    material: "cobweb"
    name: "<gray>Nothing here yet"
    lore: ""
  hints:
    open: "<#FFD166>» Click to open"
    play: "<#FFD166>» Click to play"
    view: "<#FFD166>» Click to view"
    spectate: "<#FFD166>» Click to spectate"
    select: "<#FFD166>» Click to select"
    selected: "<#0DCB07>✔ Selected"
    change: "<#FFD166>» Click to change"
    toggle: "<#FFD166>» Click to toggle"
    create: "<#FFD166>» Click to create a lobby"
    join: "<#FFD166>» Click to join"
    invite: "<#FFD166>» Click to invite"
    choose: "<#FFD166>» Click to choose"
    leave: "<#FFD166>» Click to leave"
# Built-in Eternal Parkour hologram leaderboards.
#
# Replaces the DecentHolograms / HolographicDisplays softdepends. Uses Paper's modern
# Display API (TextDisplay + ItemDisplay + Interaction), so:
#   - no armor-stand entities (no chunk-ticking cost)
#   - billboarded text that always faces the player
#   - clickable page-flip via an Interaction entity (right-click = next, shift-right = prev)
#   - entities are setPersistent(false) — they vanish on crash and never leak
#
# Lines use MiniMessage tags (https://docs.advntr.dev/minimessage/). PlaceholderAPI
# placeholders like %eternalparkour_player_rank_default_1% resolve (the old %witp_...% ones too).
#
# Positioning convention: the `location` Y is the TOP of the visible text — the lines
# grow DOWNWARD from there (DecentHolograms compatible). Icon `offset` is relative to
# that top anchor:
#   - offset Y > 0 : above the title line
#   - offset Y < 0 : below the bottom line
#   - offset X / Z : sideways from the text center
#
# So `offset: '0.0, 0.6, 0.0'` floats the icon ~half a block above the title text.
#
# The holograms below are examples and start disabled. Set 'location' to 'world:x:y:z:yaw'
# (for example 'world:0.5:80:0.5:0'), set 'enabled: true' and restart the server.

holograms:

  # ---------- Classic mode leaderboard (top 10, multi-page) ----------
  classic-leaderboard:
    enabled: false
    location: 'world:-4.076:87:3.628:0'
    update-interval-ticks: 40
    interaction:
      width: 1.6
      height: 3.0
      offset-y: -1.4              # click box covers the whole text column
    pages:
      - lines:
          - '<gradient:#FF6464:#FFB36B><bold>Eternal Parkour</bold></gradient>'
          - '<gray>Default mode · Top 5'
          - '<color:#36a1ff>☻ <color:#41ff6c>Player  <color:#58fe83>-  <color:#74d9ff>⌚ <color:#6ffe9a>Time  <color:#86feb1>-  <color:#0dffd1>♞  <color:#9dfdc8>Score'
          - '<color:#36a1ff>☻ <color:#41ff6c>1. <color:#4dff77>%eternalparkour_player_rank_default_1% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%eternalparkour_time_rank_default_1% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%eternalparkour_score_rank_default_1%'
          - '<color:#36a1ff>☻ <color:#41ff6c>2. <color:#4dff77>%eternalparkour_player_rank_default_2% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%eternalparkour_time_rank_default_2% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%eternalparkour_score_rank_default_2%'
          - '<color:#36a1ff>☻ <color:#41ff6c>3. <color:#4dff77>%eternalparkour_player_rank_default_3% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%eternalparkour_time_rank_default_3% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%eternalparkour_score_rank_default_3%'
          - '<color:#36a1ff>☻ <color:#41ff6c>4. <color:#4dff77>%eternalparkour_player_rank_default_4% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%eternalparkour_time_rank_default_4% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%eternalparkour_score_rank_default_4%'
          - '<color:#36a1ff>☻ <color:#41ff6c>5. <color:#4dff77>%eternalparkour_player_rank_default_5% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%eternalparkour_time_rank_default_5% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%eternalparkour_score_rank_default_5%'
          - ''
          - '<aqua><bold>Right-click: next page · Sneak + right-click: back</bold></aqua>'
        icons:
          - material: GOLDEN_BOOTS
            enchanted: true
            offset: '0.0,0.6,0.0'
            scale: 0.6
      - lines:
          - '<gradient:#FF6464:#FFB36B><bold>Eternal Parkour</bold></gradient>'
          - '<gray>Default mode · 6 to 10'
          - '<color:#36a1ff>☻ <color:#41ff6c>Player  <color:#58fe83>-  <color:#74d9ff>⌚ <color:#6ffe9a>Time  <color:#86feb1>-  <color:#0dffd1>♞  <color:#9dfdc8>Score'
          - '<color:#36a1ff>☻ <color:#41ff6c>6. <color:#4dff77>%eternalparkour_player_rank_default_6% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%eternalparkour_time_rank_default_6% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%eternalparkour_score_rank_default_6%'
          - '<color:#36a1ff>☻ <color:#41ff6c>7. <color:#4dff77>%eternalparkour_player_rank_default_7% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%eternalparkour_time_rank_default_7% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%eternalparkour_score_rank_default_7%'
          - '<color:#36a1ff>☻ <color:#41ff6c>8. <color:#4dff77>%eternalparkour_player_rank_default_8% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%eternalparkour_time_rank_default_8% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%eternalparkour_score_rank_default_8%'
          - '<color:#36a1ff>☻ <color:#41ff6c>9. <color:#4dff77>%eternalparkour_player_rank_default_9% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%eternalparkour_time_rank_default_9% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%eternalparkour_score_rank_default_9%'
          - '<color:#36a1ff>☻ <color:#41ff6c>10. <color:#4dff77>%eternalparkour_player_rank_default_10% <color:#58fe83>- <color:#74d9ff>⌚ <color:#6ffe9a>%eternalparkour_time_rank_default_10% <color:#86feb1>- <color:#0dffd1>♞ <color:#9dfdc8>%eternalparkour_score_rank_default_10%'
          - ''
          - '<aqua><bold>Right-click: next page · Sneak + right-click: back</bold></aqua>'
        icons:
          - material: GOLDEN_BOOTS
            enchanted: true
            offset: '0.0,0.6,0.0'
            scale: 0.6

  # ---------- Hourglass mode top 5 (single page) ----------
  hourglass-leaderboard:
    enabled: false
    location: 'world:-14.101:87:3.628:0'
    update-interval-ticks: 40
    interaction:
      width: 1.6
      height: 2.5
      offset-y: -1.0
    pages:
      - lines:
          - '<gradient:#FF6464:#FFB36B><bold>Eternal Parkour</bold></gradient>'
          - '<gray>Hourglass · Top 5'
          - '<color:#ff8080>☻ Player  <color:#ffba80>-  ⌚ Time  <color:#ffeb80>-  ♞ Score'
          - '<color:#ff8080>1. <color:#ffba80>%eternalparkour_player_rank_hourglass_1% - %eternalparkour_time_rank_hourglass_1% - %eternalparkour_score_rank_hourglass_1%'
          - '<color:#ff8080>2. <color:#ffba80>%eternalparkour_player_rank_hourglass_2% - %eternalparkour_time_rank_hourglass_2% - %eternalparkour_score_rank_hourglass_2%'
